  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register new Staff</title>
<style>
  body {
    font-family: "Times New Roman", Times, serif;
    margin: 20px;
  }
  h1 {
    font-size: 36px;
    margin-bottom: 20px;
  }
  .form-row {
    margin: 8px 0;
    display: flex;
    align-items: center;
  }
  .form-row label {
    width: 150px;
    font-size: 18px;
  }
  .form-row input[type="text"],
  .form-row input[type="password"],
  .form-row input[type="email"] {
    width: 250px;
    padding: 5px;
    font-size: 16px;
  }
  select {
    padding: 4px;
    font-size: 16px;
  }
  .other-label {
    margin-left: 10px;
    font-size: 18px;
  }
  .other-input {
    width: 200px;
    padding: 5px;
    margin-left: 5px;
  }
  .buttons {
    margin-top: 15px;
  }
  .buttons button {
    padding: 5px 15px;
    font-size: 16px;
    margin-right: 5px;
  }
</style>
</head>
<body>

<h1>Register new Staff</h1>

<form action="#" method="post">

  <div class="form-row">
    <label>Username:</label>
    <input type="text" name="username" required>
  </div>

  <div class="form-row">
    <label>Password:</label>
    <input type="password" name="password" required>
  </div>

  <div class="form-row">
    <label>Full Name:</label>
    <input type="text" name="fullname" required>
  </div>

  <div class="form-row">
    <label>Email:</label>
    <input type="email" name="email" required>
  </div>

  <div class="form-row">
    <label>Phone Number:</label>
    <input type="text" name="phone" required>
  </div>

  <div class="form-row">
    <label>Address:</label>
    <input type="text" name="address" required>
  </div>

  <div class="form-row">
    <label>Designation:</label>
    <select name="designation">
      <option value="General manager">General manager</option>
      <option value="Sales executive">Sales executive</option>
      <option value="Secretary">Secretary</option>
      <option value="Project supervisor" selected>Project supervisor</option>
      <option value="Cleaner">Cleaner</option>
      <option value="Gate keeper">Gate keeper</option>
    </select>
    <span class="other-label">Other:</span>
    <input type="text" name="designation_other" class="other-input">
  </div>

  <div class="form-row">
    <label>Department:</label>
    <select name="department">
      <option value="Management">Management</option>
      <option value="Logistic department">Logistic department</option>
      <option value="Procurement department">Procurement department</option>
      <option value="Information technology" selected>Information technology</option>
      <option value="Security department">Security department</option>
      <option value="Operational department">Operational department</option>
      <option value="Research department">Research department</option>
      <option value="Legal department">Legal department</option>
      <option value="Finance">Finance</option>
      <option value="Others">Others</option>
    </select>
  </div>

  <div class="form-row">
    <label>Hotel Branch:</label>
    <select name="hotel_branch">
      <option value="Kuto">Kuto</option>
      <option value="Lafenwa">Lafenwa</option>
      <option value="Olomoore">Olomoore</option>
      <option value="Soyoye" selected>Soyoye</option>
      <option value="Panseke">Panseke</option>
      <option value="Itoku">Itoku</option>
    </select>
  </div>

  <div class="form-row buttons">
    <label></label>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </div>

</form>

</body>
</html>
  </h1>
</body>
</html>
